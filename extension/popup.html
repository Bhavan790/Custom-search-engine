<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Repo Search</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="hero">
    <div class="avatar-badge" id="avatar-badge">?</div>
    <h1 id="headline">Repo Search</h1>
  </div>

  <label class="search-bar" for="query">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.6"/>
      <path d="M11 11L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="query" type="text" placeholder="search your repos…" autofocus />
  </label>

  <p id="subhead"></p>
  <section id="results" aria-live="polite"></section>

  <script src="search-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
